<!DOCTYPE html>
<html>
<head>
    <title>Admin - Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f3f9fd;
            font-family: "Segoe UI", sans-serif;
        }
        
        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-left: 240px;
            padding: 30px;
        }

        /* ===== HEADER CARD ===== */
        .header-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px 25px;
            border: 1px solid #d6eaf6;
            margin-bottom: 25px;
        }

        .header-card h4 {
            color: #4FA3D1;
            font-weight: 700;
            margin-bottom: 4px;
        }

        /* ===== FORM CARD ===== */
        .form-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            border: 1px solid #d6eaf6;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px;
        }

        /* ===== BUTTONS ===== */
        .btn-main {
            background: #4FA3D1;
            color: #fff;
            padding: 10px 28px;
            border-radius: 30px;
            font-weight: 500;
            border: none;
        }

        .btn-main:hover {
            background: #3b90be;
        }

        .btn-cancel {
            padding: 10px 28px;
            border-radius: 30px;
            font-weight: 500;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
{% include "admin/sidebar.html" %}


<!-- MAIN -->
<div class="main-content">

    <!-- PAGE HEADER -->
    <div class="header-card">
        <h4>Edit User</h4>
        <small class="text-muted">Update user information</small>
    </div>

    <!-- FORM -->
    <div class="form-card">
        <form method="POST">
            {% csrf_token %}

            <div class="row g-4">

                <div class="col-md-6">
                    <label>Username</label>
                    <input type="text"
                           name="username"
                           value="{{ user.username }}"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6">
                    <label>Email</label>
                    <input type="email"
                           name="email"
                           value="{{ user.email }}"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6">
                    <label>Mobile</label>
                    <input type="text"
                           name="mobile"
                           value="{{ user.mobile }}"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6">
                    <label>City</label>
                    <input type="text"
                           name="city"
                           value="{{ user.city }}"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-12">
                    <label>Address</label>
                    <textarea name="address"
                              class="form-control"
                              rows="3"
                              required>{{ user.address }}</textarea>
                </div>

            </div>

            <!-- ACTIONS -->
            <div class="mt-4">
                <button type="submit" class="btn btn-main">
                    Update User
                </button>

                <a href="{% url 'admin_users' %}" class="btn btn-outline-secondary btn-cancel ms-2">
                    Cancel
                </a>
            </div>

        </form>
    </div>

</div>

</body>
</html>
