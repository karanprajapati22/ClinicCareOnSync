<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --main: #4FA3D1;
            --bg: #F3F9FD;
            --card: #FFFFFF;
            --border: #D6EAF6;
        }

        body {
            background-color: var(--bg);
            font-family: "Segoe UI", sans-serif;
        }

        /* Center container */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Login Card */
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            padding: 35px;
        }

        /* Header */
        .login-title {
            font-weight: 700;
            color: var(--main);
            text-align: center;
            margin-bottom: 5px;
        }

        .login-subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        /* Inputs */
        .form-control {
            border-radius: 10px;
            padding: 11px 14px;
        }

        .form-label {
            font-weight: 600;
            color: #2c3e50;
        }

        /* Button */
        .btn-main {
            background-color: var(--main);
            border: none;
            border-radius: 25px;
            padding: 10px;
            font-weight: 600;
            color: #fff;
        }

        .btn-main:hover {
            background-color: #3b92c2;
        }

        /* Logo text */
        .brand-text {
            text-align: center;
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--main);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="login-container">

    <div class="login-card">

        <div class="brand-text">
            Clinic On CareSync
        </div>

        <h4 class="login-title">Admin Login</h4>
        <div class="login-subtitle">
            Sign in to access admin dashboard
        </div>

        <!-- Messages -->
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-danger">{{ msg }}</div>
            {% endfor %}
        {% endif %}

        <!-- Login Form -->
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter admin email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>

            <button class="btn btn-main w-100 mt-3">
                Login
            </button>
        </form>

    </div>

</div>

</body>
</html>
