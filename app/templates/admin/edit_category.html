<!DOCTYPE html>
<html>
<head>
    <title>Admin - Edit Doctor Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --main: #4FA3D1;
            --bg: #F3F9FD;
            --card: #FFFFFF;
            --border: #D6EAF6;
        }

        body {
            background-color: var(--bg);
            font-family: "Segoe UI", sans-serif;
        }

        /* ===== Main Content ===== */
        .main-content {
            margin-left: 240px;
            padding: 25px;
        }

        /* ===== Top Bar ===== */
        .topbar {
            background: var(--card);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .page-title {
            font-weight: 700;
            color: var(--main);
        }

        /* ===== Card ===== */
        .edit-card {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        /* ===== Form ===== */
        .form-label {
            font-weight: 600;
            color: #2c3e50;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px 12px;
        }

        /* Buttons */
        .btn-main {
            background-color: var(--main);
            border: none;
            border-radius: 20px;
            padding: 8px 22px;
            color: #fff;
            font-weight: 500;
        }

        .btn-main:hover {
            background-color: #3b92c2;
        }

        .btn-outline {
            border-radius: 20px;
            padding: 8px 22px;
        }
    </style>
</head>
<body>

<!-- ===== Sidebar ===== -->
{% include "admin/sidebar.html" %}


<!-- ===== Main Content ===== -->
<div class="main-content">

    <!-- ===== Top Bar ===== -->
    <div class="topbar d-flex justify-content-between align-items-center">
        <div>
            <h4 class="page-title mb-0">Edit Doctor Category</h4>
            <small class="text-muted">Update category details</small>
        </div>
    </div>

    <!-- ===== Form Card ===== -->
    <div class="edit-card p-4">

        <form method="POST">
            {% csrf_token %}

            <div class="row">

                <!-- Category Name -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">Category Name</label>
                    <input type="text"
                           name="category_name"
                           class="form-control"
                           value="{{ category.category_name }}"
                           required>
                </div>

                <!-- Department -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">Department</label>
                    <select name="department_id" class="form-control" required>
                        {% for dept in departments %}
                            <option value="{{ dept.id }}"
                                {% if dept.id == category.department.id %}selected{% endif %}>
                                {{ dept.department_name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

            </div>

            <!-- Buttons -->
            <div class="mt-4">
                <button class="btn btn-main me-2">
                    Update Category
                </button>
                <a href="{% url 'doctor_category' %}" class="btn btn-outline-secondary btn-outline">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
