{% include "admin/sidebar.html" %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
    --main:#4FA3D1;
    --bg:#F4F8FB;
    --card:#ffffff;
    --border:#e3eef6;
}

body{
    background: var(--bg);
}

.main-content{
    margin-left:240px;
    padding:30px;
}

.card-custom{
    background:var(--card);
    border-radius:14px;
    border:1px solid var(--border);
}

.page-title{
    font-weight:600;
    color:var(--main);
}

.form-control, .form-select{
    border-radius:8px;
    border:1px solid #dce7f0;
}

.btn-main{
    background:var(--main);
    border:none;
}

.btn-main:hover{
    background:#3c8dbc;
}
</style>

<div class="main-content">

    <div class="card card-custom shadow-sm p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="page-title mb-0">Add Doctor Availability</h4>
            <a href="{% url 'admin_availability_list' %}" class="btn btn-outline-secondary btn-sm">
                Back to List
            </a>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success rounded-3">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Doctor</label>
                    {{ form.doctor }}
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Available Date</label>
                    {{ form.available_date }}
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Start Time</label>
                    {{ form.start_time }}
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">End Time</label>
                    {{ form.end_time }}
                </div>

            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-main px-4">
                    Save Availability
                </button>
            </div>

        </form>

    </div>

</div>
