<!DOCTYPE html>
<html>
<head>
    <title>Admin - Departments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --main: #4FA3D1;
            --bg: #F3F9FD;
            --card: #FFFFFF;
            --border: #D6EAF6;
        }

        body {
            background-color: var(--bg);
            font-family: "Segoe UI", sans-serif;
        }


        .main-content {
            margin-left: 240px;
            padding: 25px;
        }

        .topbar {
            background: var(--card);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .page-title {
            font-weight: 700;
            color: var(--main);
        }

        .data-card {
            background: var(--card);
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .table thead {
            background: #E9F4FB;
        }

        .table thead th {
            font-weight: 600;
            padding: 14px;
            text-align: center;
        }

        .table tbody td {
            padding: 14px;
            text-align: center;
        }

        .table tbody tr:hover {
            background-color: #f6fbff;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
{% include "admin/sidebar.html" %}

<!-- Main -->
<div class="main-content">

    <div class="topbar">
        <h4 class="page-title mb-0">Department Management</h4>
        <small class="text-muted">Add and manage departments</small>
    </div>

    <!-- Add Department -->
    <div class="card data-card mb-4">
        <div class="card-body">
            <h5 class="mb-3">Add Department</h5>

            <form method="POST">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6">
                        <input type="text" name="department_name" class="form-control" placeholder="Enter department name" required>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary">Add Department</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- List -->
    <div class="card data-card">
        <div class="card-body">
            <h5 class="mb-3">Department List</h5>

            <table class="table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Department Name</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for d in departments %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td style="font-weight:600;">{{ d.department_name }}</td>
                        <td>
                            <a href="{% url 'delete_department' d.id %}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Delete this department?')">Delete</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center text-muted py-4">No departments found</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

        </div>
    </div>

</div>

</body>
</html>
