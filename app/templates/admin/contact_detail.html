{% include "admin/sidebar.html" %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
    --main: #4FA3D1;
    --bg: #F3F9FD;
    --card: #FFFFFF;
    --border: #D6EAF6;
}

body {
    background: var(--bg);
    font-family: "Segoe UI", sans-serif;
}

.main-content {
    margin-left: 240px;
    padding: 30px;
}

/* HEADER */
.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.page-title {
    font-weight: 700;
    color: var(--main);
}

/* CARD */
.detail-card {
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    padding: 25px;
    max-width: 850px;
    margin: auto;
}

/* INFO GRID */
.info-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 15px;
    margin-bottom: 20px;
}

.label {
    font-weight: 600;
    color: var(--main);
}

.value {
    color: #333;
}

/* BADGE */
.date-badge {
    background: #f1f1f1;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 13px;
}

/* MESSAGE BOX */
.message-box {
    background: #f8fbfd;
    border-radius: 10px;
    padding: 18px;
    color: #444;
    line-height: 1.6;
    border: 1px solid var(--border);
}

/* BUTTON */
.back-btn {
    background: var(--main);
    color: white;
    padding: 8px 18px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
}

.back-btn:hover {
    background: #3b8db8;
    color: #fff;
}

/* SECTION TITLE */
.section-title {
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 8px;
}
</style>

<div class="main-content">

    <!-- HEADER -->
    <div class="page-header">
        <div>
            <h4 class="page-title">Message Details</h4>
            <small class="text-muted">View full message information</small>
        </div>

        <a href="{% url 'admin_contact_list' %}" class="back-btn">
            ← Back
        </a>
    </div>

    <!-- CARD -->
    <div class="detail-card">

        <!-- INFO -->
        <div class="info-grid">
            <div class="label">Name</div>
            <div class="value">{{ contact.name }}</div>

            <div class="label">Email</div>
            <div class="value">{{ contact.email }}</div>

            <div class="label">Date</div>
            <div class="value">
                <span class="date-badge">
                    {{ contact.created_at|date:"d M Y, h:i A" }}
                </span>
            </div>
        </div>

        <!-- MESSAGE -->
        <div>
            <div class="section-title">Message</div>
            <div class="message-box">
                {{ contact.message }}
            </div>
        </div>

    </div>

</div>

{% endblock %}
