    {% extends 'nav.html' %}
    {% block content %}

    <style>
    /* ===== HARD STOP SCROLL ===== */
    html, body {
        height: 100%;
        margin: 0;
        overflow: hidden !important;
        font-family: 'Poppins', sans-serif;
    }

    /* ===== PAGE WRAPPER (NAVBAR HEIGHT ADJUSTED) ===== */
    .page-wrapper {
        height: calc(100vh - 80px); /* navbar height */
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    /* ===== BACKGROUND IMAGE ===== */
    .page-wrapper::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("https://t4.ftcdn.net/jpg/15/14/91/77/240_F_1514917735_UubOYsR4oh5mS8dlgeQd2nvrT5bQ8teV.jpg");
        background-size: cover;
        background-position: center;
        filter: blur(3px);
        z-index: -1;
    }

    /* ===== FORM CARD ===== */
    .register-card {
        width: 100%;
        max-width: 900px;
        background: #ffffff;
        border-radius: 18px;
        padding: 26px 30px;
        box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    }

    /* Title */
    .register-title {
        font-size: 2rem;
        font-weight: 700;
        color: #007c9d;
        text-align: center;
        margin-bottom: 20px;
    }

    /* Inputs */
    .form-control {
        border-radius: 8px;
    }

    /* Button */
    .btn-primary {
        background-color: #007c9d;
        border: none;
        border-radius: 25px;
        padding: 12px;
        font-weight: 500;
    }

    .btn-primary:hover {
        background-color: #00627a;
    }
    </style>

    <div class="page-wrapper">

        <div class="register-card">

            <div class="register-title">Create an Account</div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">User Name</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter email" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Password</label>
                        <input type="password"
                                name="password"
                                class="form-control"
                                minlength="8"
                                placeholder="Minimum 8 characters"
                                required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Mobile No</label>
                        <input type="text" name="mobile" class="form-control" placeholder="Enter mobile number" required>
                    </div>

                    <div class="col-12 mb-3">
                        <label class="form-label">Address</label>
                        <textarea name="address" class="form-control" rows="2" placeholder="Enter address" required></textarea>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">City</label>
                        <input type="text" name="city" class="form-control" placeholder="Enter City" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">State</label>
                        <input type="text" name="state" class="form-control" placeholder="Enter State" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Pincode</label>
                        <input type="text" name="pincode" class="form-control" placeholder="Enter Pincode" required>
                    </div>

                </div>

                <button type="submit" class="btn btn-primary w-100 mt-2">
                    Register
                </button>
            </form>

            <p class="text-center mt-3 mb-0">
                Already have an account?
                <a href="{% url 'login' %}" class="fw-semibold text-decoration-none">
                    Login
                </a>
            </p>

        </div>
    </div>

    {% endblock %}
