{% extends "nav.html" %}
{% block content %}

<style>
body {
    background: linear-gradient(to right, #eef7fb, #f6fcff);
}

/* ===== MAIN WRAPPER ===== */
.profile-container {
    min-height: calc(100vh - 120px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* ===== CARD ===== */
.profile-card {
    width: 900px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.08);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* ===== HEADER ===== */
.profile-header {
    background: linear-gradient(135deg, #007c9d, #11b2cb);
    color: white;
    padding: 18px;
    text-align: center;
    font-size: 20px;
    font-weight: 600;
}

/* ===== BODY ===== */
.profile-body {
    padding: 20px 30px 10px;
}

/* ===== AVATAR ===== */
.profile-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #e3f4fa;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: #007c9d;
    margin: auto;
    margin-bottom: 10px;
    box-shadow: 0 8px 20px rgba(0,124,157,0.15);
}

/* ===== NAME ===== */
.profile-name {
    text-align: center;
    font-weight: 600;
    margin-bottom: 15px;
}

/* ===== GRID ===== */
.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.full-width {
    grid-column: span 2;
}

/* ===== INPUT ===== */
.form-control {
    height: 40px;
    border-radius: 10px;
    font-size: 14px;
    border: 1px solid #dbeaf3;
}

.form-control:focus {
    border-color: #11b2cb;
    box-shadow: 0 0 0 2px rgba(17,178,203,0.15);
}

/* ===== LABEL ===== */
label {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 4px;
}

/* ===== FOOTER BUTTON AREA ===== */
.profile-footer {
    padding: 15px;
    text-align: center;
    border-top: 1px solid #eef3f7;
}

/* ===== BUTTON ===== */
.update-btn {
    background: linear-gradient(135deg, #007c9d, #11b2cb);
    color: #fff;
    padding: 10px 35px;
    border-radius: 30px;
    border: none;
    font-size: 14px;
    font-weight: 500;
    transition: 0.3s;
}

.update-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,124,157,0.2);
}

/* ===== ALERT ===== */
.alert {
    font-size: 13px;
    padding: 6px;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {
    .profile-card {
        width: 100%;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full-width {
        grid-column: span 1;
    }
}
</style>

<div class="profile-container">

    <div class="profile-card">

        <!-- HEADER -->
        <div class="profile-header">
            My Profile
        </div>

        <!-- BODY -->
        <div class="profile-body">

            <!-- AVATAR -->
            <div class="profile-avatar">
                {{ profile.username|first|upper }}
            </div>

            <div class="profile-name">
                {{ profile.username }}
            </div>

            <!-- MESSAGE -->
            {% if messages %}
                {% for msg in messages %}
                    <div class="alert alert-success text-center">
                        {{ msg }}
                    </div>
                {% endfor %}
            {% endif %}

            <!-- FORM -->
            <form method="POST">
                {% csrf_token %}

                <div class="form-grid">

                    <div>
                        <label>Full Name</label>
                        <input type="text" name="username" class="form-control"
                               value="{{ profile.username }}">
                    </div>

                    <div>
                        <label>Mobile</label>
                        <input type="text" name="mobile" class="form-control"
                               value="{{ profile.mobile }}">
                    </div>

                    <div class="full-width">
                        <label>Address</label>
                        <input type="text" name="address" class="form-control"
                               value="{{ profile.address }}">
                    </div>

                    <div>
                        <label>City</label>
                        <input type="text" name="city" class="form-control"
                               value="{{ profile.city }}">
                    </div>

                    <div>
                        <label>State</label>
                        <input type="text" name="state" class="form-control"
                               value="{{ profile.state }}">
                    </div>

                    <div class="full-width">
                        <label>Pincode</label>
                        <input type="text" name="pincode" class="form-control"
                               value="{{ profile.pincode }}">
                    </div>

                </div>

                <!-- BUTTON FIXED AREA -->
                <div class="profile-footer">
                    <button type="submit" class="update-btn">
                        Update Profile
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
