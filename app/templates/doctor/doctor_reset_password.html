<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Reset Password | Hospital System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(to right, #eaf6fb, #f7fbfd);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            padding: 20px;
        }

        .card-box {
            max-width: 420px;
            margin: auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.18);
        }

        .title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            color: #007c9d;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.95rem;
            color: #6c757d;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 8px;
        }

        .btn-main {
            background-color: #007c9d;
            border: none;
            border-radius: 25px;
            padding: 12px;
            font-weight: 500;
            width: 100%;
            color: white;
        }

        .btn-main:hover {
            background-color: #00627a;
        }

        .back-link {
            text-align: center;
            margin-top: 18px;
            font-size: 0.95rem;
        }

        .back-link a {
            color: #007c9d;
            font-weight: 500;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="card-box">

        <div class="title">Reset Password</div>
        <div class="subtitle">Create a new secure password</div>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        {% if message %}
            <div class="alert alert-success">{{ message }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter new password"
                       minlength="8"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password"
                       name="confirm_password"
                       class="form-control"
                       placeholder="Confirm new password"
                       minlength="8"
                       required>
            </div>

            <button type="submit" class="btn btn-main">
                Reset Password
            </button>
        </form>

        <div class="back-link">
            Back to
            <a href="{% url 'doctor_login' %}">Doctor Login</a>
        </div>

    </div>
</div>

</body>
</html>
