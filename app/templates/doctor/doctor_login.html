<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Login | Hospital System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(to right, #eaf6fb, #f7fbfd);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            padding: 20px;
        }

        .login-card {
            max-width: 420px;
            margin: auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.18);
        }

        .login-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            color: #007c9d;
            margin-bottom: 10px;
        }

        .login-subtitle {
            text-align: center;
            font-size: 0.95rem;
            color: #6c757d;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 8px;
        }

        .btn-login {
            background-color: #007c9d;
            border: none;
            border-radius: 25px;
            padding: 12px;
            font-weight: 500;
            width: 100%;
        }

        .btn-login:hover {
            background-color: #00627a;
        }

        .forgot-link {
            text-align: right;
            margin-top: -5px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .forgot-link a {
            color: #007c9d;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        .register-link {
            text-align: center;
            margin-top: 18px;
            font-size: 0.95rem;
        }

        .register-link a {
            color: #007c9d;
            font-weight: 500;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="login-title">Doctor Login</div>
        <div class="login-subtitle">Access your doctor dashboard</div>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter your password"
                       required>
            </div>

            <!-- Forgot Password Link -->
            <div class="forgot-link">
                <a href="{% url 'doctor_forgot_password' %}">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" class="btn btn-login">
                Login
            </button>
        </form>

        <div class="register-link">
            New doctor?
            <a href="{% url 'doctor_register' %}">Register here</a>
        </div>

    </div>

</div>

</body>
</html>
